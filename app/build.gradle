plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.kotlin.compose)
    // TODO 01. Please note you need to have the ksp plugin enabled so Moshi annotations are
    //  understood and used by the compiler
    alias(libs.plugins.kotlin.ksp)
    alias(libs.plugins.kotlin.kapt)
}

android {
    namespace 'gal.uvigo.networking_example'
    compileSdk 37

    defaultConfig {
        applicationId "gal.uvigo.networking_example"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = '11'
    }
    buildFeatures {
        compose true
    }
}

dependencies {
    implementation libs.androidx.core.ktx
    implementation libs.androidx.activity.compose

    // Compose
    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.compose.ui
    implementation libs.androidx.compose.ui.tooling.preview
    implementation libs.androidx.compose.material3
    debugImplementation libs.androidx.compose.ui.tooling

    // Lifecycle
    implementation libs.androidx.lifecycle.viewmodel.ktx
    implementation libs.androidx.lifecycle.viewmodel.compose
    implementation libs.androidx.lifecycle.runtime.compose
    implementation libs.kotlinx.coroutines.android

    // TODO 01. Add dependencies for Retrofit + Moshi + Coil
    // Networking
    implementation libs.retrofit
    implementation libs.retrofit.converter.moshi
    implementation libs.moshi
    // This KSP (Kotlin Symbol Processing) annotation generates code at compile-time.
    // It automatically creates adapters so you do not need to add giant generic libraries to your app.
    ksp libs.moshi.kotlin.codegen
    // Image Loading
    implementation libs.coil.compose
    implementation libs.coil.network.okhttp

    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
    androidTestImplementation platform(libs.androidx.compose.bom)
}
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}
